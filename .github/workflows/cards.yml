# schedules re-registered 2026-10-07 after repo was made public
name: Daily cards

on:
  schedule:
    - cron: '30 2 * * *' # 8:00 AM IST → Telugu motivational quote (free)
    - cron: '30 7 * * *' # 1:00 PM IST → English health tip with photo (5 credits, once per tip)
  workflow_dispatch:
    inputs:
      type:
        description: 'quote or health'
        default: quote
      dry_run:
        description: 'Generate video only, do not post'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Make and post card
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          TYPE="${{ inputs.type }}"
          if [ -z "$TYPE" ]; then [ "${{ github.event.schedule }}" = "30 7 * * *" ] && TYPE=health || TYPE=quote; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then npm run cards -- --type "$TYPE" --dry-run; else npm run cards -- --type "$TYPE"; fi

      - name: Keep the video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_number }}
          path: output/**/final.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit posted log
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "insta-autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cards-posted.json assets/photos 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Log posted card (+ new photo)" && git pull --rebase -q && git push
