# Started by the Mac at 7 PM IST (~/.modernstories/trigger.sh). GitHub's own cron ran 5–6 h late
# for this repo and caused midnight double posts, so there is deliberately no schedule here.
name: Daily Telugu story

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate video only, do not post'
        type: boolean
        default: false

permissions:
  contents: write # to commit posted.json

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate and post
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELUGU_VOICE: ${{ vars.TELUGU_VOICE }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          # Lets src/host.js upload the video to this repo's public "media" release for Instagram to fetch.
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then npm run telugu -- --dry-run; else npm run telugu -- --if-due; fi

      - name: Keep the video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/**/final.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit posted log
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "insta-autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telugu-posted.json assets/voice 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Log posted Telugu story" && git pull --rebase -q && git push)

      # Instagram tokens expire after 60 days. This extends it every run and, if a GH_PAT
      # secret (fine-grained token with "Secrets: write" on this repo) exists, saves it back.
      - name: Refresh Instagram token
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REFRESHED_TOKEN_FILE: ${{ runner.temp }}/ig.token
        run: |
          npm run refresh-token
          if [ -n "$GH_TOKEN" ] && [ -s "$REFRESHED_TOKEN_FILE" ]; then
            gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < "$REFRESHED_TOKEN_FILE"
          fi
          rm -f "$REFRESHED_TOKEN_FILE"
